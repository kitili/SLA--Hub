version: '3.9'

services:
  # ── DATABASE ──────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: silverleaf_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       silverleaf_v3
      POSTGRES_USER:     silverleaf
      POSTGRES_PASSWORD: ${DB_PASSWORD:-silverleaf_secure_pw}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../sql/001_migration.sql:/docker-entrypoint-initdb.d/001_migration.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silverleaf -d silverleaf_v3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── BACKEND ───────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../devops/Dockerfile.backend
    container_name: silverleaf_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://silverleaf:${DB_PASSWORD:-silverleaf_secure_pw}@db:5432/silverleaf_v3
      NODE_ENV:     production
      PORT:         5000
    volumes:
      - uploads:/app/uploads
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── FRONTEND ──────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: ../devops/Dockerfile.frontend
      args:
        VITE_API_URL:  ${VITE_API_URL:-https://api.silverleaf.co.tz/api}
        VITE_WS_URL:   ${VITE_WS_URL:-https://api.silverleaf.co.tz}
    container_name: silverleaf_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro

  # ── CERTBOT (SSL) ─────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: silverleaf_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    command: certonly --webroot --webroot-path=/var/www/certbot
             --email admin@silverleaf.co.tz --agree-tos --no-eff-email
             -d silverleaf.co.tz -d www.silverleaf.co.tz
    profiles:
      - ssl  # only run with: docker compose --profile ssl up certbot

volumes:
  db_data:
  uploads:
  certbot_www:
  certbot_conf:

networks:
  default:
    name: silverleaf_network
