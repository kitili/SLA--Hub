name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Typecheck, lint, build, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ""

      - name: Unit tests
        run: npm run test
        env:
          DATABASE_URL: ""

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | tar -xz gitleaks

      - name: Scan working tree
        run: ./gitleaks detect --no-git --source . --config gitleaks.toml

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ""

      - name: Run e2e tests
        run: npm run e2e
        env:
          DATABASE_URL: ""
          HR_ADMIN_EMAILS: hr@silverleaf.co.tz
