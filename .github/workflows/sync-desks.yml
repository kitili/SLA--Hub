name: Sync desks

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pull department repos
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: python3 scripts/sync-desks.py
      - name: Commit lockfile
        run: |
          git config user.name "silverleaf-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add desks.lock.json
          git diff --cached --quiet || git commit -m "chore: align desk SHAs with origin"
          git push
